name: salonemarket
description: "SaloneMarket — Multi-vendor mobile commerce for Sierra Leone"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.4
  go_router: ^13.2.0
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  image_picker: ^1.1.1
  flutter_svg: ^2.0.10
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  google_fonts: ^6.2.1
  equatable: ^2.0.5
  uuid: ^4.4.0
  http: ^1.2.1
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
