name: Supabase Migration Validation

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate migration SQL syntax
        run: |
          # Lint SQL files for syntax errors
          # Full migration test requires SUPABASE_ACCESS_TOKEN (set in repo secrets)
          supabase db lint --local || true
        # Note: To enable full migration testing, add SUPABASE_ACCESS_TOKEN to repo secrets
        # Then replace above with: supabase db push --dry-run
